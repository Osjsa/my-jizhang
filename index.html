<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的消费记录</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .summary-box h3 {
            margin: 0 0 10px;
            font-size: 15px;
            color: #666;
        }

        .summary-box strong {
            font-size: 25px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        input, select {
            flex: 1;
            min-width: 0;
        }

        button {
            border: none;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete-btn {
            background: #d9534f;
            padding: 8px 12px;
        }

        .export-btn {
            background: #555;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            color: #666;
            font-size: 14px;
        }

        .month-select {
            width: 100%;
            margin-bottom: 15px;
        }

        .category-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .category-item {
            padding: 12px;
            background: #f1f3f5;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .summary {
                grid-template-columns: 1fr;
            }

            .form-row {
                flex-direction: column;
            }

            .category-list {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 9px 4px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>我的消费记录</h1>

    <!-- 当前月份 -->
    <div class="card">
        <h2>记录消费</h2>

        <div class="form-row">
            <input type="date" id="date">
            <input type="number" id="amount" placeholder="消费金额（元）" step="0.01" min="0">
        </div>

        <div class="form-row">
            <select id="category">
                <option value="餐饮">餐饮</option>
                <option value="交通">交通</option>
                <option value="购物">购物</option>
                <option value="娱乐">娱乐</option>
                <option value="学习">学习</option>
                <option value="住宿">住宿</option>
                <option value="医疗">医疗</option>
                <option value="其他">其他</option>
            </select>

            <input type="text" id="note" placeholder="备注，例如：午饭、买耳机">
        </div>

        <button onclick="addExpense()">添加消费</button>
    </div>

    <!-- 数据统计 -->
    <div class="summary">

        <div class="summary-box">
            <h3>本月消费</h3>
            <strong id="monthTotal">¥0.00</strong>
        </div>

        <div class="summary-box">
            <h3>今日消费</h3>
            <strong id="todayTotal">¥0.00</strong>
        </div>

        <div class="summary-box">
            <h3>消费笔数</h3>
            <strong id="expenseCount">0</strong>
        </div>

    </div>

    <!-- 月份选择 -->
    <div class="card">
        <h2>消费记录</h2>

        <select id="monthSelect" class="month-select" onchange="render()">
        </select>

        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>类别</th>
                    <th>金额</th>
                    <th>备注</th>
                    <th>操作</th>
                </tr>
            </thead>

            <tbody id="expenseTable">
            </tbody>
        </table>

        <button class="export-btn" onclick="exportCSV()">
            导出当前月份 CSV
        </button>
    </div>

    <!-- 分类统计 -->
    <div class="card">
        <h2>分类统计</h2>
        <div id="categoryStats" class="category-list"></div>
    </div>

</div>

<script>

    // 从浏览器本地读取数据
    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    const today = new Date();

    // 默认日期为今天
    document.getElementById("date").value =
        today.toISOString().split("T")[0];


    // 添加消费
    function addExpense() {

        const date = document.getElementById("date").value;
        const amount = parseFloat(document.getElementById("amount").value);
        const category = document.getElementById("category").value;
        const note = document.getElementById("note").value;

        if (!date) {
            alert("请选择日期");
            return;
        }

        if (!amount || amount <= 0) {
            alert("请输入正确的消费金额");
            return;
        }

        const expense = {
            id: Date.now(),
            date: date,
            amount: amount,
            category: category,
            note: note
        };

        expenses.push(expense);

        // 保存到浏览器
        localStorage.setItem("expenses", JSON.stringify(expenses));

        // 清空输入
        document.getElementById("amount").value = "";
        document.getElementById("note").value = "";

        render();
    }


    // 删除消费
    function deleteExpense(id) {

        if (!confirm("确定要删除这条消费记录吗？")) {
            return;
        }

        expenses = expenses.filter(expense => expense.id !== id);

        localStorage.setItem("expenses", JSON.stringify(expenses));

        render();
    }


    // 获取当前月份
    function getCurrentMonth() {

        return today.getFullYear() + "-" +
            String(today.getMonth() + 1).padStart(2, "0");

    }


    // 获取所有存在记录的月份
    function getMonths() {

        const months = expenses.map(expense => expense.date.slice(0, 7));

        const currentMonth = getCurrentMonth();

        months.push(currentMonth);

        return [...new Set(months)].sort().reverse();
    }


    // 更新月份选择器
    function updateMonthSelect() {

        const select = document.getElementById("monthSelect");

        const oldValue = select.value;

        select.innerHTML = "";

        getMonths().forEach(month => {

            const option = document.createElement("option");

            option.value = month;
            option.textContent = month;

            select.appendChild(option);

        });

        if (getMonths().includes(oldValue)) {
            select.value = oldValue;
        }

    }


    // 渲染页面
    function render() {

        updateMonthSelect();

        const selectedMonth =
            document.getElementById("monthSelect").value;

        const monthExpenses = expenses.filter(expense =>
            expense.date.startsWith(selectedMonth)
        );

        // 计算月份总消费
        const monthTotal = monthExpenses.reduce(
            (sum, expense) => sum + expense.amount,
            0
        );

        // 计算今日消费
        const todayString =
            today.toISOString().split("T")[0];

        const todayTotal = expenses
            .filter(expense => expense.date === todayString)
            .reduce((sum, expense) => sum + expense.amount, 0);

        document.getElementById("monthTotal").textContent =
            "¥" + monthTotal.toFixed(2);

        document.getElementById("todayTotal").textContent =
            "¥" + todayTotal.toFixed(2);

        document.getElementById("expenseCount").textContent =
            monthExpenses.length;


        // 显示消费记录
        const table = document.getElementById("expenseTable");

        table.innerHTML = "";

        if (monthExpenses.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        这个月还没有消费记录
                    </td>
                </tr>
            `;

        } else {

            monthExpenses
                .sort((a, b) => b.date.localeCompare(a.date))
                .forEach(expense => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${expense.date}</td>
                        <td>${expense.category}</td>
                        <td>¥${expense.amount.toFixed(2)}</td>
                        <td>${expense.note || "-"}</td>
                        <td>
                            <button
                                class="delete-btn"
                                onclick="deleteExpense(${expense.id})">
                                删除
                            </button>
                        </td>
                    `;

                    table.appendChild(row);

                });

        }


        // 分类统计
        const categoryStats = {};

        monthExpenses.forEach(expense => {

            if (!categoryStats[expense.category]) {
                categoryStats[expense.category] = 0;
            }

            categoryStats[expense.category] += expense.amount;

        });

        const categoryContainer =
            document.getElementById("categoryStats");

        categoryContainer.innerHTML = "";

        Object.entries(categoryStats)
            .sort((a, b) => b[1] - a[1])
            .forEach(([category, amount]) => {

                categoryContainer.innerHTML += `
                    <div class="category-item">
                        <span>${category}</span>
                        <strong>¥${amount.toFixed(2)}</strong>
                    </div>
                `;

            });

        if (Object.keys(categoryStats).length === 0) {

            categoryContainer.innerHTML =
                '<div class="empty">暂无分类数据</div>';

        }

    }


    // 导出 CSV
    function exportCSV() {

        const selectedMonth =
            document.getElementById("monthSelect").value;

        const monthExpenses = expenses.filter(expense =>
            expense.date.startsWith(selectedMonth)
        );

        let csv = "日期,类别,金额,备注\n";

        monthExpenses.forEach(expense => {

            csv += `${expense.date},${expense.category},${expense.amount},${expense.note}\n`;

        });

        const blob = new Blob(
            ["\ufeff" + csv],
            { type: "text/csv;charset=utf-8;" }
        );

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = `${selectedMonth}消费记录.csv`;

        link.click();

        URL.revokeObjectURL(url);

    }


    // 页面加载时显示数据
    render();

</script>

</body>
</html>
