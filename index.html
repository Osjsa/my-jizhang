<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账簿 · 记账本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1EAD9;
    --paper-deep: #E8DFC8;
    --ink: #2B2A26;
    --ink-soft: #6B6459;
    --rule: #C9BEA3;
    --seal: #A93226;
    --seal-deep: #7B241C;
    --jade: #3F6B58;
    --jade-deep: #2C4C3E;
    --gold: #A9781E;
    --card: #FAF6EC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 32px),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans SC', sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:960px; margin:0 auto;}

  /* Header */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom:3px double var(--ink);
    padding-bottom:18px; margin-bottom:28px;
    flex-wrap:wrap; gap:16px;
  }
  .title-block{display:flex; align-items:baseline; gap:14px;}
  h1{
    font-family:'Noto Serif SC', serif; font-weight:900;
    font-size:34px; letter-spacing:4px; color:var(--ink);
  }
  .subtitle{font-size:12px; color:var(--ink-soft); letter-spacing:2px;}
  .today{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--ink-soft);
    text-align:right;
  }

  /* Seal / signature element */
  .seal{
    width:96px; height:96px; border-radius:50%;
    border:3.5px solid var(--seal);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--seal); transform:rotate(-6deg);
    font-family:'Noto Serif SC', serif; font-weight:700;
    flex-shrink:0; position:relative;
    box-shadow: inset 0 0 0 2px rgba(169,50,38,0.15);
  }
  .seal.jade{border-color:var(--jade); color:var(--jade); box-shadow: inset 0 0 0 2px rgba(63,107,88,0.15);}
  .seal .seal-label{font-size:10px; letter-spacing:2px;}
  .seal .seal-amount{font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700; margin-top:2px;}

  .balance-row{display:flex; gap:20px; align-items:center; margin-bottom:32px; flex-wrap:wrap;}
  .balance-text{font-family:'Noto Serif SC', serif; font-size:15px; color:var(--ink-soft);}
  .balance-text b{color:var(--ink); font-size:22px; font-family:'JetBrains Mono', monospace;}

  /* Layout */
  .grid{display:grid; grid-template-columns: 1.15fr 1fr; gap:24px;}
  @media (max-width:760px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--card);
    border:1px solid var(--rule);
    box-shadow: 3px 3px 0 rgba(43,42,38,0.06);
    padding:22px;
  }
  .card h2{
    font-family:'Noto Serif SC', serif; font-size:16px; letter-spacing:3px;
    padding-bottom:10px; margin-bottom:16px; border-bottom:1.5px solid var(--rule);
    display:flex; align-items:center; gap:8px;
  }
  .card h2 .bar{width:4px; height:16px; background:var(--seal); display:inline-block;}

  /* Entry form styled as a slip */
  .type-toggle{display:flex; gap:0; margin-bottom:16px; border:1.5px solid var(--ink); width:fit-content;}
  .type-toggle button{
    font-family:'Noto Serif SC', serif; font-size:14px; padding:8px 22px;
    background:transparent; border:none; cursor:pointer; letter-spacing:2px; color:var(--ink-soft);
  }
  .type-toggle button.active.expense{background:var(--seal); color:#fff;}
  .type-toggle button.active.income{background:var(--jade); color:#fff;}
  .type-toggle button:not(:last-child){border-right:1.5px solid var(--ink);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; letter-spacing:2px; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field select{
    width:100%; padding:9px 10px; font-family:'Noto Sans SC', sans-serif; font-size:14px;
    background:var(--paper); border:1px solid var(--rule); color:var(--ink);
  }
  .field input[type=number]{font-family:'JetBrains Mono', monospace;}
  .field select{cursor:pointer;}
  .cat-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .cat-chip{
    padding:6px 12px; border:1px solid var(--rule); font-size:12.5px; cursor:pointer;
    background:var(--paper); color:var(--ink-soft); user-select:none;
  }
  .cat-chip.active.expense{background:var(--seal); border-color:var(--seal); color:#fff;}
  .cat-chip.active.income{background:var(--jade); border-color:var(--jade); color:#fff;}

  .submit-btn{
    width:100%; padding:11px; margin-top:6px; font-family:'Noto Serif SC', serif;
    font-size:15px; letter-spacing:4px; border:none; cursor:pointer; color:#fff;
  }
  .submit-btn.expense{background:var(--seal-deep);}
  .submit-btn.income{background:var(--jade-deep);}
  .submit-btn:hover{opacity:0.9;}

  /* Ledger list */
  .ledger-list{max-height:520px; overflow-y:auto;}
  .ledger-row{
    display:grid; grid-template-columns: 62px 1fr auto 24px; gap:10px; align-items:center;
    padding:10px 0; border-bottom:1px dashed var(--rule);
  }
  .ledger-row:last-child{border-bottom:none;}
  .ledger-date{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft); line-height:1.3;}
  .ledger-mid .ledger-cat{font-size:13px; font-weight:600;}
  .ledger-mid .ledger-note{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .ledger-amt{font-family:'JetBrains Mono', monospace; font-size:14.5px; font-weight:700; text-align:right;}
  .ledger-amt.expense{color:var(--seal);}
  .ledger-amt.income{color:var(--jade);}
  .del-btn{
    background:none; border:none; color:var(--rule); cursor:pointer; font-size:16px; line-height:1;
  }
  .del-btn:hover{color:var(--seal);}
  .empty-note{color:var(--ink-soft); font-size:13px; text-align:center; padding:30px 0;}

  /* Summary */
  .tabbar{display:flex; gap:0; margin-bottom:16px; border:1.5px solid var(--ink); width:fit-content;}
  .tabbar button{
    font-family:'Noto Serif SC', serif; font-size:13px; padding:6px 18px;
    background:transparent; border:none; cursor:pointer; letter-spacing:2px; color:var(--ink-soft);
  }
  .tabbar button:not(:last-child){border-right:1.5px solid var(--ink);}
  .tabbar button.active{background:var(--ink); color:var(--paper);}

  .sum-totals{display:flex; gap:18px; margin-bottom:18px;}
  .sum-box{flex:1; padding:12px; background:var(--paper); border:1px solid var(--rule); text-align:center;}
  .sum-box .lbl{font-size:11px; color:var(--ink-soft); letter-spacing:2px;}
  .sum-box .val{font-family:'JetBrains Mono', monospace; font-size:18px; font-weight:700; margin-top:4px;}
  .sum-box.expense .val{color:var(--seal);}
  .sum-box.income .val{color:var(--jade);}
  .sum-box.net .val{color:var(--ink);}

  .cat-bar-row{margin-bottom:11px;}
  .cat-bar-head{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; color:var(--ink);}
  .cat-bar-head .amt{font-family:'JetBrains Mono', monospace; color:var(--ink-soft);}
  .cat-bar-track{height:8px; background:var(--paper-deep); position:relative;}
  .cat-bar-fill{height:100%; background:var(--gold);}
  .cat-bar-fill.expense{background:var(--seal);}
  .cat-bar-fill.income{background:var(--jade);}

  footer{
    text-align:center; margin-top:40px; font-size:11px; color:var(--ink-soft); letter-spacing:2px;
  }
  .reset-link{color:var(--ink-soft); text-decoration:underline; cursor:pointer; font-size:11px;}
  .loading{text-align:center; padding:40px; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>账 簿</h1>
      <span class="subtitle">LEDGER · 个人收支记录</span>
    </div>
    <div class="today" id="todayLabel"></div>
  </header>

  <div class="balance-row" id="balanceRow"></div>

  <div class="grid">
    <!-- Left: entry + list -->
    <div>
      <div class="card" style="margin-bottom:20px;">
        <h2><span class="bar"></span>新 增 一 笔</h2>
        <div class="type-toggle">
          <button id="btnExpense" class="active expense" onclick="setType('expense')">支出</button>
          <button id="btnIncome" class="income" onclick="setType('income')">收入</button>
        </div>
        <div class="field">
          <label>金额 AMOUNT (¥)</label>
          <input type="number" id="inputAmount" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="field">
          <label>分类 CATEGORY</label>
          <div class="cat-grid" id="catGrid"></div>
        </div>
        <div class="field">
          <label>备注 NOTE</label>
          <input type="text" id="inputNote" placeholder="例如：食堂午饭 / 室友转账">
        </div>
        <div class="field">
          <label>日期 DATE</label>
          <input type="date" id="inputDate">
        </div>
        <button class="submit-btn expense" id="submitBtn" onclick="addRecord()">记 下 这 一 笔</button>
      </div>

      <div class="card">
        <h2><span class="bar"></span>明 细 · 全 部 记 录</h2>
        <div class="ledger-list" id="ledgerList"></div>
      </div>
    </div>

    <!-- Right: summaries -->
    <div>
      <div class="card">
        <h2><span class="bar"></span>统 计 概 览</h2>
        <div class="tabbar">
          <button id="tabWeek" class="active" onclick="setRange('week')">本周</button>
          <button id="tabMonth" onclick="setRange('month')">本月</button>
        </div>
        <div class="sum-totals">
          <div class="sum-box income"><div class="lbl">收入</div><div class="val" id="sumIncome">¥0</div></div>
          <div class="sum-box expense"><div class="lbl">支出</div><div class="val" id="sumExpense">¥0</div></div>
          <div class="sum-box net"><div class="lbl">结余</div><div class="val" id="sumNet">¥0</div></div>
        </div>
        <div style="margin-bottom:6px; font-size:12px; letter-spacing:2px; color:var(--ink-soft);">支出分类占比</div>
        <div id="expenseBreakdown"></div>
        <div style="margin:14px 0 6px; font-size:12px; letter-spacing:2px; color:var(--ink-soft);">收入分类占比</div>
        <div id="incomeBreakdown"></div>
      </div>
    </div>
  </div>

  <footer>
    手账式记账 · 数据仅保存在你的账户中　
    <span class="reset-link" onclick="resetAll()">清空全部记录</span>
  </footer>
</div>

<script>
const EXPENSE_CATS = ['餐饮','交通','购物','娱乐','居住','医疗','学习','人情','其他'];
const INCOME_CATS = ['工资/兼职','转账','红包','奖学金','报销','其他'];

let records = [];
let currentType = 'expense';
let currentCat = EXPENSE_CATS[0];
let currentRange = 'week';
let loaded = false;

function fmtMoney(n){
  const sign = n < 0 ? '-' : '';
  return sign + '¥' + Math.abs(n).toFixed(2);
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function renderToday(){
  const d = new Date();
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('todayLabel').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${wd}`;
}

async function loadRecords(){
  try{
    const res = await window.storage.get('transactions', false);
    records = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    records = [];
  }
  loaded = true;
}

async function saveRecords(){
  try{
    await window.storage.set('transactions', JSON.stringify(records), false);
  }catch(e){
    console.error('保存失败', e);
    alert('保存失败，请稍后再试');
  }
}

function setType(type){
  currentType = type;
  document.getElementById('btnExpense').classList.toggle('active', type==='expense');
  document.getElementById('btnIncome').classList.toggle('active', type==='income');
  currentCat = (type==='expense' ? EXPENSE_CATS : INCOME_CATS)[0];
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.className = 'submit-btn ' + type;
  submitBtn.textContent = type === 'expense' ? '记 下 这 一 笔 支 出' : '记 下 这 一 笔 收 入';
  renderCatGrid();
}

function renderCatGrid(){
  const cats = currentType === 'expense' ? EXPENSE_CATS : INCOME_CATS;
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  cats.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (c === currentCat ? ' active ' + currentType : '');
    chip.textContent = c;
    chip.onclick = () => { currentCat = c; renderCatGrid(); };
    grid.appendChild(chip);
  });
}

async function addRecord(){
  const amountInput = document.getElementById('inputAmount');
  const amount = parseFloat(amountInput.value);
  if(!amount || amount <= 0){
    alert('请输入有效的金额');
    return;
  }
  const note = document.getElementById('inputNote').value.trim();
  const date = document.getElementById('inputDate').value || todayStr();

  records.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    type: currentType,
    amount: amount,
    category: currentCat,
    note: note,
    date: date
  });
  records.sort((a,b) => b.date.localeCompare(a.date));

  await saveRecords();
  amountInput.value = '';
  document.getElementById('inputNote').value = '';
  renderAll();
}

async function deleteRecord(id){
  records = records.filter(r => r.id !== id);
  await saveRecords();
  renderAll();
}

async function resetAll(){
  if(!confirm('确定要清空全部记账记录吗？此操作无法撤销。')) return;
  records = [];
  await saveRecords();
  renderAll();
}

function renderLedgerList(){
  const list = document.getElementById('ledgerList');
  list.innerHTML = '';
  if(records.length === 0){
    list.innerHTML = '<div class="empty-note">还没有记录 — 从上方开始记下第一笔吧</div>';
    return;
  }
  records.forEach(r => {
    const row = document.createElement('div');
    row.className = 'ledger-row';
    const d = new Date(r.date + 'T00:00:00');
    const dateLabel = `${d.getMonth()+1}/${d.getDate()}`;
    row.innerHTML = `
      <div class="ledger-date">${dateLabel}</div>
      <div class="ledger-mid">
        <div class="ledger-cat">${r.category}</div>
        ${r.note ? `<div class="ledger-note">${escapeHtml(r.note)}</div>` : ''}
      </div>
      <div class="ledger-amt ${r.type}">${r.type === 'expense' ? '-' : '+'}${r.amount.toFixed(2)}</div>
      <button class="del-btn" title="删除">✕</button>
    `;
    row.querySelector('.del-btn').onclick = () => deleteRecord(r.id);
    list.appendChild(row);
  });
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function getRangeRecords(range){
  const now = new Date();
  let start;
  if(range === 'week'){
    const day = now.getDay(); // 0 Sun
    const diffToMonday = (day === 0 ? 6 : day - 1);
    start = new Date(now);
    start.setHours(0,0,0,0);
    start.setDate(now.getDate() - diffToMonday);
  } else {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  const startStr = start.toISOString().slice(0,10);
  return records.filter(r => r.date >= startStr);
}

function setRange(range){
  currentRange = range;
  document.getElementById('tabWeek').classList.toggle('active', range==='week');
  document.getElementById('tabMonth').classList.toggle('active', range==='month');
  renderSummary();
}

function renderSummary(){
  const rangeRecords = getRangeRecords(currentRange);
  const income = rangeRecords.filter(r => r.type==='income').reduce((a,r)=>a+r.amount,0);
  const expense = rangeRecords.filter(r => r.type==='expense').reduce((a,r)=>a+r.amount,0);
  document.getElementById('sumIncome').textContent = fmtMoney(income);
  document.getElementById('sumExpense').textContent = fmtMoney(expense);
  document.getElementById('sumNet').textContent = fmtMoney(income - expense);

  renderBreakdown('expenseBreakdown', rangeRecords.filter(r=>r.type==='expense'), 'expense');
  renderBreakdown('incomeBreakdown', rangeRecords.filter(r=>r.type==='income'), 'income');
}

function renderBreakdown(elId, recs, type){
  const el = document.getElementById(elId);
  el.innerHTML = '';
  if(recs.length === 0){
    el.innerHTML = '<div class="empty-note" style="padding:10px 0;">暂无数据</div>';
    return;
  }
  const totals = {};
  recs.forEach(r => { totals[r.category] = (totals[r.category]||0) + r.amount; });
  const max = Math.max(...Object.values(totals));
  const sorted = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  sorted.forEach(([cat, amt]) => {
    const row = document.createElement('div');
    row.className = 'cat-bar-row';
    row.innerHTML = `
      <div class="cat-bar-head"><span>${cat}</span><span class="amt">${fmtMoney(amt)}</span></div>
      <div class="cat-bar-track"><div class="cat-bar-fill ${type}" style="width:${(amt/max*100).toFixed(1)}%"></div></div>
    `;
    el.appendChild(row);
  });
}

function renderBalanceRow(){
  const income = records.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const expense = records.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const net = income - expense;
  const row = document.getElementById('balanceRow');
  row.innerHTML = `
    <div class="seal jade">
      <div class="seal-label">总收入</div>
      <div class="seal-amount">${income.toFixed(0)}</div>
    </div>
    <div class="seal">
      <div class="seal-label">总支出</div>
      <div class="seal-amount">${expense.toFixed(0)}</div>
    </div>
    <div class="balance-text">累计结余　<b>${fmtMoney(net)}</b></div>
  `;
}

function renderAll(){
  renderLedgerList();
  renderSummary();
  renderBalanceRow();
}

async function init(){
  document.getElementById('inputDate').value = todayStr();
  renderToday();
  renderCatGrid();
  document.querySelector('.ledger-list').innerHTML = '<div class="loading">正在加载记录…</div>';
  await loadRecords();
  renderAll();
}

init();
</script>
</body>
</html>
