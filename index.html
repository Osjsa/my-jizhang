<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Finora · 个人财务管理</title>


<style>

/* =========================
   基础
========================= */

:root {

    --bg: #0d1117;

    --panel: #151b24;

    --panel-light: #1b2330;

    --border: rgba(255,255,255,0.08);

    --text: #f4f6f8;

    --muted: #8993a4;

    --gold: #d6b77a;

    --gold-light: #ead29d;

    --green: #78c69b;

    --red: #e58c8c;

    --blue: #83a9d9;

}


* {

    box-sizing: border-box;

}


body {

    margin: 0;

    min-height: 100vh;

    padding: 35px 20px 60px;

    font-family:

        Inter,

        "SF Pro Display",

        "Microsoft YaHei",

        sans-serif;

    color: var(--text);

    background:

        radial-gradient(

            circle at 10% 0%,

            rgba(214,183,122,0.12),

            transparent 28%

        ),

        radial-gradient(

            circle at 90% 20%,

            rgba(83,117,160,0.10),

            transparent 30%

        ),

        var(--bg);

}


.container {

    max-width: 1180px;

    margin: auto;

}


/* =========================
   顶部导航
========================= */

.topbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 45px;

}


.logo {

    display: flex;

    align-items: center;

    gap: 12px;

}


.logo-mark {

    width: 40px;

    height: 40px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 12px;

    color: #151515;

    background: var(--gold);

    font-weight: bold;

    font-size: 20px;

}


.logo-title {

    font-size: 19px;

    font-weight: 600;

    letter-spacing: 0.5px;

}


.logo-subtitle {

    font-size: 11px;

    color: var(--muted);

    letter-spacing: 1px;

    margin-top: 3px;

}


.current-date {

    color: var(--muted);

    font-size: 13px;

}


/* =========================
   Hero
========================= */

.hero {

    display: grid;

    grid-template-columns: 1.5fr 1fr;

    gap: 20px;

    margin-bottom: 20px;

}


.hero-card {

    position: relative;

    min-height: 240px;

    padding: 35px;

    border: 1px solid var(--border);

    border-radius: 24px;

    overflow: hidden;

    background:

        linear-gradient(

            135deg,

            #1b222d,

            #11161e

        );

}


.hero-card::after {

    content: "";

    position: absolute;

    width: 280px;

    height: 280px;

    right: -100px;

    top: -120px;

    border-radius: 50%;

    border: 1px solid

        rgba(214,183,122,0.2);

    box-shadow:

        0 0 0 25px

        rgba(214,183,122,0.03),

        0 0 0 50px

        rgba(214,183,122,0.02);

}


.hero-label {

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 15px;

}


.hero-balance {

    font-size: 48px;

    font-weight: 600;

    letter-spacing: -2px;

    color: var(--gold-light);

}


.hero-description {

    color: var(--muted);

    font-size: 13px;

    margin-top: 18px;

}


.hero-side {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;

}


.metric-card {

    padding: 25px;

    border-radius: 20px;

    border: 1px solid var(--border);

    background: var(--panel);

}


.metric-title {

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 15px;

}


.metric-value {

    font-size: 25px;

    font-weight: 600;

}


.metric-income {

    color: var(--green);

}


.metric-expense {

    color: var(--red);

}


/* =========================
   主要布局
========================= */

.main-grid {

    display: grid;

    grid-template-columns: 1fr 1.35fr;

    gap: 20px;

}


.panel {

    padding: 26px;

    border-radius: 22px;

    border: 1px solid var(--border);

    background: rgba(

        21,

        27,

        36,

        0.85

    );

    backdrop-filter: blur(20px);

}


.panel-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 24px;

}


.panel-title {

    font-size: 18px;

    font-weight: 600;

}


.panel-description {

    color: var(--muted);

    font-size: 12px;

    margin-top: 5px;

}


/* =========================
   表单
========================= */

.type-switch {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    padding: 5px;

    margin-bottom: 20px;

    border-radius: 12px;

    background: #0d1219;

}


.type-btn {

    border: none;

    padding: 11px;

    border-radius: 8px;

    color: var(--muted);

    background: transparent;

    cursor: pointer;

    font-size: 13px;

}


.type-btn.active-expense {

    color: white;

    background: rgba(

        229,

        140,

        140,

        0.18

    );

}


.type-btn.active-income {

    color: white;

    background: rgba(

        120,

        198,

        155,

        0.18

    );

}


.form-group {

    margin-bottom: 15px;

}


.form-label {

    display: block;

    margin-bottom: 8px;

    color: var(--muted);

    font-size: 12px;

}


input,

select {

    width: 100%;

    padding: 13px 14px;

    border-radius: 10px;

    border: 1px solid var(--border);

    outline: none;

    color: var(--text);

    background: #0f141b;

    font-size: 14px;

}


input:focus,

select:focus {

    border-color: var(--gold);

}


select option {

    background: #151b24;

}


.form-row {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

}


.add-btn {

    width: 100%;

    margin-top: 5px;

    padding: 14px;

    border: none;

    border-radius: 10px;

    color: #151515;

    background: var(--gold);

    font-weight: 600;

    cursor: pointer;

    transition: 0.2s;

}


.add-btn:hover {

    background: var(--gold-light);

    transform: translateY(-1px);

}


/* =========================
   月份选择
========================= */

.month-select {

    width: 180px;

}


/* =========================
   记录表格
========================= */

.table-wrapper {

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

}


th {

    padding: 13px 8px;

    text-align: left;

    color: var(--muted);

    font-size: 11px;

    font-weight: 500;

    border-bottom: 1px solid var(--border);

}


td {

    padding: 16px 8px;

    border-bottom: 1px solid

        rgba(

            255,

            255,

            255,

            0.05

        );

    font-size: 13px;

}


td:first-child {

    color: var(--muted);

}


.income-text {

    color: var(--green);

    font-weight: 600;

}


.expense-text {

    color: var(--red);

    font-weight: 600;

}


.delete-btn {

    padding: 6px 10px;

    border: 1px solid

        rgba(

            255,

            255,

            255,

            0.08

        );

    border-radius: 7px;

    color: var(--muted);

    background: transparent;

    cursor: pointer;

}


.delete-btn:hover {

    color: var(--red);

    border-color: var(--red);

}


/* =========================
   分类统计
========================= */

.category-section {

    margin-top: 20px;

}


.category-list {

    display: grid;

    grid-template-columns:

        repeat(2, 1fr);

    gap: 10px;

}


.category-item {

    padding: 14px;

    border-radius: 12px;

    border: 1px solid var(--border);

    background: var(--panel-light);

}


.category-name {

    color: var(--muted);

    font-size: 12px;

    margin-bottom: 7px;

}


.category-amount {

    font-size: 16px;

    font-weight: 600;

}


/* =========================
   导出
========================= */

.export-btn {

    margin-top: 20px;

    padding: 10px 15px;

    border: 1px solid

        rgba(

            214,

            183,

            122,

            0.4

        );

    border-radius: 9px;

    color: var(--gold-light);

    background: transparent;

    cursor: pointer;

}


.export-btn:hover {

    background: rgba(

        214,

        183,

        122,

        0.08

    );

}


/* =========================
   空状态
========================= */

.empty {

    padding: 30px;

    text-align: center;

    color: var(--muted);

}


/* =========================
   手机端
========================= */

@media (max-width: 850px) {


    body {

        padding: 20px 12px 40px;

    }


    .topbar {

        margin-bottom: 30px;

    }


    .current-date {

        display: none;

    }


    .hero {

        grid-template-columns: 1fr;

    }


    .main-grid {

        grid-template-columns: 1fr;

    }


}


@media (max-width: 600px) {


    .hero-card {

        padding: 25px;

    }


    .hero-balance {

        font-size: 38px;

    }


    .hero-side {

        gap: 10px;

    }


    .metric-card {

        padding: 18px 12px;

    }


    .metric-value {

        font-size: 19px;

    }


    .form-row {

        grid-template-columns: 1fr;

    }


    .panel {

        padding: 18px;

    }


    .panel-header {

        align-items: flex-start;

        gap: 12px;

        flex-direction: column;

    }


    .month-select {

        width: 100%;

    }


    .category-list {

        grid-template-columns: 1fr;

    }


}

</style>

</head>


<body>


<div class="container">


    <!-- 顶部 -->

    <div class="topbar">


        <div class="logo">


            <div class="logo-mark">

                F

            </div>


            <div>


                <div class="logo-title">

                    FINORA

                </div>


                <div class="logo-subtitle">

                    PERSONAL FINANCE

                </div>

            </div>

        </div>


        <div

            class="current-date"

            id="currentDate"

        >

        </div>


    </div>


    <!-- 顶部数据 -->

    <div class="hero">


        <div class="hero-card">


            <div class="hero-label">

                本月净结余

            </div>


            <div

                class="hero-balance"

                id="monthBalance"

            >

                ¥0.00

            </div>


            <div class="hero-description">

                收入减去支出后的本月实际结余

            </div>


        </div>


        <div class="hero-side">


            <div class="metric-card">


                <div class="metric-title">

                    本月收入

                </div>


                <div

                    class="metric-value metric-income"

                    id="monthIncome"

                >

                    ¥0.00

                </div>

            </div>


            <div class="metric-card">


                <div class="metric-title">

                    本月支出

                </div>


                <div

                    class="metric-value metric-expense"

                    id="monthExpense"

                >

                    ¥0.00

                </div>

            </div>


            <div class="metric-card">


                <div class="metric-title">

                    今日收入

                </div>


                <div

                    class="metric-value metric-income"

                    id="todayIncome"

                >

                    ¥0.00

                </div>

            </div>


            <div class="metric-card">


                <div class="metric-title">

                    今日支出

                </div>


                <div

                    class="metric-value metric-expense"

                    id="todayExpense"

                >

                    ¥0.00

                </div>

            </div>

        </div>

    </div>


    <!-- 主体 -->

    <div class="main-grid">


        <!-- 添加记录 -->

        <div class="panel">


            <div class="panel-header">


                <div>


                    <div class="panel-title">

                        新增记录

                    </div>


                    <div

                        class="panel-description"

                    >

                        记录每一笔资金流动

                    </div>

                </div>

            </div>


            <div class="type-switch">


                <button

                    id="expenseBtn"

                    class="type-btn active-expense"

                    onclick=

                    "setType('expense')"

                >

                    支出

                </button>


                <button

                    id="incomeBtn"

                    class="type-btn"

                    onclick=

                    "setType('income')"

                >

                    收入

                </button>

            </div>


            <div class="form-group">


                <label

                    class="form-label"

                >

                    日期

                </label>


                <input

                    type="date"

                    id="date"

                >

            </div>


            <div class="form-group">


                <label

                    class="form-label"

                >

                    金额

                </label>


                <input

                    type="number"

                    id="amount"

                    placeholder="0.00"

                    step="0.01"

                    min="0"

                >

            </div>


            <div class="form-group">


                <label

                    class="form-label"

                >

                    分类

                </label>


                <select

                    id="category"

                >

                </select>

            </div>


            <div class="form-group">


                <label

                    class="form-label"

                >

                    备注

                </label>


                <input

                    type="text"

                    id="note"

                    placeholder="例如：兼职工资、午餐、游戏提现"

                >

            </div>


            <button

                id="addBtn"

                class="add-btn"

                onclick=

                "addRecord()"

            >

                添加支出记录

            </button>

        </div>


        <!-- 记录 -->

        <div class="panel">


            <div class="panel-header">


                <div>


                    <div class="panel-title">

                        资金流动

                    </div>


                    <div

                        class="panel-description"

                    >

                        查看历史收入与支出

                    </div>

                </div>


                <select

                    id="monthSelect"

                    class="month-select"

                    onchange=

                    "render()"

                >

                </select>

            </div>


            <div class="table-wrapper">


                <table>


                    <thead>


                        <tr>


                            <th>

                                日期

                            </th>


                            <th>

                                类型

                            </th>


                            <th>

                                分类

                            </th>


                            <th>

                                金额

                            </th>


                            <th>

                                备注

                            </th>


                            <th>

                            </th>

                        </tr>

                    </thead>


                    <tbody

                        id="recordTable"

                    >

                    </tbody>

                </table>

            </div>


            <button

                class="export-btn"

                onclick=

                "exportCSV()"

            >

                导出 CSV

            </button>

        </div>

    </div>


    <!-- 分类 -->

    <div

        class="panel category-section"

    >


        <div class="panel-header">


            <div>


                <div class="panel-title">

                    分类分析

                </div>


                <div

                    class="panel-description"

                >

                    当前月份资金流动分布

                </div>

            </div>

        </div>


        <div

            id="categoryStats"

            class="category-list"

        >

        </div>

    </div>


</div>


<script>


/* =========================
   数据
========================= */


let records =

    JSON.parse(

        localStorage.getItem(

            "moneyRecords"

        )

    ) || [];


let currentType =

    "expense";


const today =

    new Date();


const todayString =

    today

    .toISOString()

    .split("T")[0];


document

    .getElementById(

        "date"

    )

    .value =

    todayString;


document

    .getElementById(

        "currentDate"

    )

    .textContent =

    today

    .toLocaleDateString(

        "zh-CN",

        {

            year: "numeric",

            month: "long",

            day: "numeric"

        }

    );


/* 分类 */


const expenseCategories = [

    ["餐饮", "餐饮"],

    ["交通", "交通"],

    ["购物", "购物"],

    ["娱乐", "娱乐"],

    ["学习", "学习"],

    ["住宿", "住宿"],

    ["医疗", "医疗"],

    ["其他支出", "其他支出"]

];


const incomeCategories = [

    ["工资", "工资"],

    ["游戏提现", "游戏提现"],

    ["看视频赚钱", "看视频赚钱"],

    ["红包", "红包"],

    ["兼职", "兼职"],

    ["出售物品", "出售物品"],

    ["其他收入", "其他收入"]

];


/* =========================
   收入 / 支出切换
========================= */


function setType(type) {


    currentType = type;


    const expenseBtn =

        document

        .getElementById(

            "expenseBtn"

        );


    const incomeBtn =

        document

        .getElementById(

            "incomeBtn"

        );


    const addBtn =

        document

        .getElementById(

            "addBtn"

        );


    if (

        type ===

        "income"

    ) {


        incomeBtn

            .classList

            .add(

                "active-income"

            );


        expenseBtn

            .classList

            .remove(

                "active-expense"

            );


        addBtn.textContent =

            "添加收入记录";


    } else {


        expenseBtn

            .classList

            .add(

                "active-expense"

            );


        incomeBtn

            .classList

            .remove(

                "active-income"

            );


        addBtn.textContent =

            "添加支出记录";

    }


    updateCategories();

}


/* =========================
   更新分类
========================= */


function updateCategories() {


    const select =

        document

        .getElementById(

            "category"

        );


    select.innerHTML = "";


    const categories =

        currentType ===

        "income"

            ? incomeCategories

            : expenseCategories;


    categories.forEach(

        item => {


            const option =

                document

                .createElement(

                    "option"

                );


            option.value =

                item[0];


            option.textContent =

                item[1];


            select.appendChild(

                option

            );

        }

    );

}


/* =========================
   添加记录
========================= */


function addRecord() {


    const date =

        document

        .getElementById(

            "date"

        )

        .value;


    const amount =

        parseFloat(

            document

            .getElementById(

                "amount"

            )

            .value

        );


    const category =

        document

        .getElementById(
